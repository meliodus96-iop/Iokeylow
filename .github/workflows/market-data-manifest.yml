name: Validate free market-data integration and runtime

on:
  push:
    branches:
      - main
      - feature/multi-asset-market-data-stack
      - feature/free-market-data-fetchers
    paths:
      - "market_data/**"
      - "requirements-marketdata.txt"
      - "tools/validate_market_data_manifest.py"
      - "tools/check_marketdata_install.py"
      - "tools/install_market_data.ps1"
      - "tools/fetch_*.py"
      - "tools/collect_*.py"
      - "tools/fetch_*.ps1"
      - ".github/workflows/market-data-manifest.yml"
  pull_request:
    paths:
      - "market_data/**"
      - "requirements-marketdata.txt"
      - "tools/validate_market_data_manifest.py"
      - "tools/check_marketdata_install.py"
      - "tools/install_market_data.ps1"
      - "tools/fetch_*.py"
      - "tools/collect_*.py"
      - "tools/fetch_*.ps1"
      - ".github/workflows/market-data-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate provider registry and safety defaults
        run: python tools/validate_market_data_manifest.py

      - name: Compile Python fetchers
        run: python -m compileall -q tools

  install-runtime-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Dukascopy CLI check
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and verify Dukascopy CLI
        shell: pwsh
        run: npx --yes dukascopy-node@1.51.1 --help

      - name: Run Windows installer and import verification
        shell: pwsh
        run: .\tools\install_market_data.ps1

  install-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free market-data packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-marketdata.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Verify NautilusTrader, CCXT, Parquet and WebSocket imports
        run: python tools/check_marketdata_install.py
