name: Phase 1 public-data research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Report project state
        run: |
          mkdir -p output
          cp reports/PHASE1_DEVELOPMENT_RESULTS.md output/
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-project-state
          path: output/