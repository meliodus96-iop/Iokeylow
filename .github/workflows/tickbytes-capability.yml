name: TickBytes microstructure capability test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public TickBytes samples
        run: |
          git clone --depth 1 https://github.com/QuantDev-stack/TickBytes.git /tmp/tickbytes
          mkdir -p data/tick
          cp /tmp/tickbytes/samples/tick_data/NIFTY/NIFTY_FUT.csv data/tick/
          cp /tmp/tickbytes/samples/tick_data/NIFTY/NIFTY_OPT.csv data/tick/
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
      - name: Run capability test
        run: python tools/tickbytes_capability.py
      - uses: actions/upload-artifact@v4
        with:
          name: tickbytes-microstructure-capability
          path: output/
