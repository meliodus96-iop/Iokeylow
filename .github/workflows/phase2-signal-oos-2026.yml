name: Phase 2 signal OOS - 2026 holdout

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download public 2026 NIFTY dataset
        run: |
          curl -L --fail --retry 3             https://raw.githubusercontent.com/ganeshbiyer/Nse_Historical_Data_2026/main/NIFTY50-INDEX.parquet             -o NIFTY50-INDEX-2026.parquet

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy

      - name: Run frozen Phase 1 signal on unseen 2026 data
        run: python tools/oos_2026_signal.py

      - name: Upload OOS evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-signal-oos-2026
          path: output/
          retention-days: 14
