[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prop-firm-research-lab"
version = "0.1.0"
description = "Event-level prop-firm rule validation and research orchestration"
requires-python = ">=3.13,<3.15"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pytest>=8,<10",
  "massive==2.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
